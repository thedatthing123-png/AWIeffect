name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted macOS architecture (Intel fallback for ARM capacity outages)
        type: choice
        options: [macos-26, macos-26-intel]
        default: macos-26
      validation:
        description: Test scope (audit runs do not publish an IPA)
        type: choice
        options: [all, repairs, final-repairs, audit, timing, stability, authoring, segmentation, motion-blur, reference-repairs, quick]
        default: all
      package_ipa:
        description: Package an IPA after validation (disable for expansion checkpoints)
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          VALIDATION: ${{ inputs.validation || 'all' }}
        run: |
          python3 scripts/test_shards.py
          python3 - <<'PY'
          import json,os
          from scripts.test_shards import active_shards
          scope=os.environ['VALIDATION']
          shards=active_shards(scope)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('value='+json.dumps({'shard':shards or ['quick']})+'\n')
          PY

  compile:
    needs: plan
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          XC=/Applications/Xcode_26.6.app
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Ensure Metal compiler toolchain
        run: |
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal --version
          fi

      - name: Compile and link every Metal shader (simulator and device)
        run: python3 scripts/validate_metal.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare verified GLTFKit2 binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_gltf_ci.py

      - name: Generate project
        run: xcodegen generate

      - name: Report Metal device
        run: |
          cat > /tmp/metal.swift <<'EOF'
          import Metal
          import Foundation
          guard let device = MTLCreateSystemDefaultDevice() else {
              fputs("Metal unavailable: refusing an unvalidated GPU build\n", stderr)
              exit(1)
          }
          print("Metal device:", device.name)
          EOF
          swift /tmp/metal.swift

      - name: Parse Swift sources
        run: find App Tests UITests -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse

      - name: Build simulator tests once
        if: inputs.validation != 'quick'
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild build-for-testing -jobs 2 \
            -project AWIeffect.xcodeproj -scheme AWIeffect \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/TestBuild CODE_SIGNING_ALLOWED=NO 2>&1 | tee compile.log
      - name: Upload compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-diagnostics
          path: |
            compile.log
            build_out/metal-preflight/**/compile.log
          if-no-files-found: ignore
      - name: Pack simulator products
        if: inputs.validation != 'quick'
        run: tar -czf test-products.tgz -C build/TestBuild/Build Products
      - name: Upload simulator products
        if: inputs.validation != 'quick'
        uses: actions/upload-artifact@v4
        with:
          name: simulator-products
          path: test-products.tgz
          compression-level: 0
          retention-days: 2

  tests:
    needs: [plan, compile]
    if: inputs.validation != 'quick'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/download-artifact@v4
        with:
          name: simulator-products
      - name: Unpack simulator products
        run: |
          mkdir -p build/TestBuild/Build
          tar -xzf test-products.tgz -C build/TestBuild/Build
      - name: Run bounded simulator shard
        timeout-minutes: 65
        env:
          TEST_SCOPE: ${{ inputs.validation || 'all' }}
          TEST_SHARD: ${{ matrix.shard }}
        run: python3 scripts/run_ci_shard.py
      # Always upload plain logs BEFORE xcresult parsing. A broken/incomplete
      # result bundle must never prevent us from finding the stalled test.
      - name: Upload raw test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.shard }}
          path: |
            test.log
            test-inventory.json
          if-no-files-found: ignore
      - name: Summarize results
        if: always()
        timeout-minutes: 2
        run: |
          if test -d TestResults.xcresult; then
            xcrun xcresulttool get test-results summary --path TestResults.xcresult --format json > test-summary.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('test-summary.json').read_text())
          expected=len(json.loads(Path('test-inventory.json').read_text())['selectors'])
          assert summary['totalTestCount']==expected, f"Executed {summary['totalTestCount']} of {expected} assigned tests"
          assert 'SKIP-GPU' not in Path('test.log').read_text(), 'GPU coverage was skipped'
          PY
            python3 scripts/compact_test_summary.py test-summary.json
            python3 scripts/compact_test_summary.py test-summary.json >> "$GITHUB_STEP_SUMMARY"
            xcrun xcresulttool get test-results tests --path TestResults.xcresult --format json > test-details.json
            python3 .github/failures.py < test-details.json
          fi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: |
            test-summary.json
            test-details.json
            /Users/runner/Library/Logs/DiagnosticReports/AWIeffect*
          if-no-files-found: ignore
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ matrix.shard }}
          path: |
            /tmp/awi-ui
            /tmp/awi-selection
            /tmp/awi-contact-sheet.png
            /tmp/awi-contact-sheets
            /tmp/awi-reference-review
            /tmp/awi-shapes
            /tmp/awi-backgrounds
            /tmp/awi-expansion
            /tmp/awi-graphs
            /tmp/awi-authoring
            /tmp/awi-premades33
          if-no-files-found: ignore

  package:
    needs: [compile, tests]
    if: >-
      ${{ always() && needs.compile.result == 'success' &&
          (needs.tests.result == 'success' || inputs.validation == 'quick') &&
          (github.event_name != 'workflow_dispatch' || inputs.package_ipa) &&
          (inputs.validation == 'all' || inputs.validation == 'repairs' || inputs.validation == 'final-repairs' || inputs.validation == 'quick' || github.event_name != 'workflow_dispatch') }}
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          XC=/Applications/Xcode_26.6.app
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Ensure Metal compiler toolchain
        run: |
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal --version
          fi

      - name: Compile and link every Metal shader (simulator and device)
        run: python3 scripts/validate_metal.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare verified GLTFKit2 binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_gltf_ci.py

      - name: Generate project
        run: xcodegen generate

      - name: Report Metal device
        run: |
          cat > /tmp/metal.swift <<'EOF'
          import Metal
          import Foundation
          guard let device = MTLCreateSystemDefaultDevice() else {
              fputs("Metal unavailable: refusing an unvalidated GPU build\n", stderr)
              exit(1)
          }
          print("Metal device:", device.name)
          EOF
          swift /tmp/metal.swift

      - name: Parse Swift sources
        run: find App Tests UITests -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          set +e
          xcodebuild archive -jobs 2 \
            -project AWIeffect.xcodeproj -scheme AWIeffect \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AWIeffect.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | tee archive.log | grep -E "error:|ARCHIVE"
          ARCHIVE_STATUS=${PIPESTATUS[0]}
          set -e
          test "$ARCHIVE_STATUS" -eq 0 || exit "$ARCHIVE_STATUS"
          test -d build/AWIeffect.xcarchive/Products/Applications/AWIeffect.app

      - name: Upload symbols and archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-symbols
          path: |
            build/AWIeffect.xcarchive/dSYMs
            archive.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/AWIeffect.xcarchive/Products/Applications/AWIeffect.app Payload/
          # The app icon and bundled resources must be inside the app (a missing asset catalog = blank icon).
          test -f Payload/AWIeffect.app/Assets.car || { echo "ERROR: Assets.car missing (no app icon)"; exit 1; }
          test -f Payload/AWIeffect.app/default-preview.jpg || { echo "ERROR: default-preview.jpg missing"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon" Payload/AWIeffect.app/Info.plist || { echo "ERROR: CFBundleIcons missing"; exit 1; }
          ls Payload/AWIeffect.app | grep -i icon || true
          zip -qry AWIeffect.ipa Payload
          ls -lh AWIeffect.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AWIeffect-ipa
          path: AWIeffect.ipa
