name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted macOS architecture (Intel fallback for ARM capacity outages)
        type: choice
        options: [macos-26, macos-26-intel]
        default: macos-26
      validation:
        description: Test scope (audit runs do not publish an IPA)
        type: choice
        options: [all, audit, quick]
        default: all

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          XC=/Applications/Xcode_26.6.app
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Ensure Metal compiler toolchain
        run: |
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal --version
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Report Metal device
        run: |
          cat > /tmp/metal.swift <<'EOF'
          import Metal
          import Foundation
          guard let device = MTLCreateSystemDefaultDevice() else {
              fputs("Metal unavailable: refusing an unvalidated GPU build\n", stderr)
              exit(1)
          }
          print("Metal device:", device.name)
          EOF
          swift /tmp/metal.swift

      - name: Parse Swift sources
        run: find App Tests UITests -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse

      - name: Run tests (simulator)
        # Quick builds: a commit message containing [quick] skips the test run and goes straight to the IPA.
        if: ${{ !contains(github.event.head_commit.message, '[quick]') && inputs.validation != 'quick' }}
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for r,v in d.items() if 'iOS' in r for x in v if x['name'].startswith('iPhone')];print(c[-1]['udid'] if c else '')")
          echo "Simulator: $SIM"
          set -o pipefail
          set +e
          FILTER=()
          if [[ "${{ inputs.validation }}" == "audit" ]]; then
            FILTER=(-only-testing:AWIeffectTests/AuditRegressionTests -only-testing:AWIeffectTests/AuditRenderRegressionTests -only-testing:AWIeffectTests/PrecompMaskImportTests -only-testing:AWIeffectTests/EssentialRegressionTests -only-testing:AWIeffectTests/DrawStudioTests -only-testing:AWIeffectTests/VisionTests -only-testing:AWIeffectTests/VideoDecodeTests -only-testing:AWIeffectTests/EditorPolishRegressionTests -only-testing:AWIeffectUITests/EditorPolishUITests)
          fi
          xcodebuild test -jobs 2 "${FILTER[@]}" \
            -project AWIeffect.xcodeproj -scheme AWIeffect \
            -destination "id=$SIM" \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 600 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|warning: .*AWI|Test Case|Executed|SKIP|FAIL|Fatal|error represents|exceeded|crashed|Restarting"
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          exit "$TEST_STATUS"

      - name: Test summary
        if: always()
        run: |
          if test -d TestResults.xcresult; then
            xcrun xcresulttool get test-results summary --path TestResults.xcresult --format json > test-summary.json
            cat test-summary.json
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat test-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Print test failures
        if: always()
        run: |
          xcrun xcresulttool get test-results tests --path TestResults.xcresult --format json 2>/dev/null | python3 .github/failures.py | head -80 || true

      - name: Print app crash reports
        if: always()
        run: |
          for f in $(find ~/Library/Logs/DiagnosticReports -name "AWIeffect*" 2>/dev/null | head -3); do
            echo "SKIP-CRASH file $f"
            python3 .github/crashdump.py "$f" | sed 's/^/SKIP-CRASH /' | head -120
          done

      - name: Upload build service diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-diagnostics
          path: |
            /Users/runner/Library/Logs/DiagnosticReports
            /Library/Logs/DiagnosticReports
          if-no-files-found: ignore

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test.log
            test-summary.json
            TestResults.xcresult
          if-no-files-found: ignore

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: /tmp/awi-ui
          if-no-files-found: warn

      - name: Upload contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-sheet
          path: /tmp/awi-contact-sheet.png
          if-no-files-found: warn

      - name: Archive (unsigned)
        if: ${{ inputs.validation != 'audit' }}
        run: |
          set -o pipefail
          set +e
          xcodebuild archive -jobs 2 \
            -project AWIeffect.xcodeproj -scheme AWIeffect \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AWIeffect.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | tee archive.log | grep -E "error:|ARCHIVE"
          ARCHIVE_STATUS=${PIPESTATUS[0]}
          set -e
          test "$ARCHIVE_STATUS" -eq 0 || exit "$ARCHIVE_STATUS"
          test -d build/AWIeffect.xcarchive/Products/Applications/AWIeffect.app

      - name: Upload symbols and archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-symbols
          path: |
            build/AWIeffect.xcarchive/dSYMs
            archive.log
          if-no-files-found: ignore

      - name: Package IPA
        if: ${{ inputs.validation != 'audit' }}
        run: |
          mkdir -p Payload
          cp -R build/AWIeffect.xcarchive/Products/Applications/AWIeffect.app Payload/
          # The app icon and bundled resources must be inside the app (a missing asset catalog = blank icon).
          test -f Payload/AWIeffect.app/Assets.car || { echo "ERROR: Assets.car missing (no app icon)"; exit 1; }
          test -f Payload/AWIeffect.app/default-preview.jpg || { echo "ERROR: default-preview.jpg missing"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon" Payload/AWIeffect.app/Info.plist || { echo "ERROR: CFBundleIcons missing"; exit 1; }
          ls Payload/AWIeffect.app | grep -i icon || true
          zip -qry AWIeffect.ipa Payload
          ls -lh AWIeffect.ipa

      - name: Upload IPA
        if: ${{ inputs.validation != 'audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: AWIeffect-ipa
          path: AWIeffect.ipa
