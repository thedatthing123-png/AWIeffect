name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Report Metal device
        run: |
          cat > /tmp/metal.swift <<'EOF'
          import Metal
          print("Metal device:", MTLCreateSystemDefaultDevice()?.name ?? "NONE")
          EOF
          swift /tmp/metal.swift || echo "Metal probe failed"

      - name: Run tests (simulator)
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for r,v in d.items() if 'iOS' in r for x in v if x['name'].startswith('iPhone')];print(c[-1]['udid'] if c else '')")
          echo "Simulator: $SIM"
          set -o pipefail
          xcodebuild test \
            -project AWIeffect.xcodeproj -scheme AWIeffect \
            -destination "id=$SIM" \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 600 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|warning: .*AWI|Test Case|Executed|SKIP|FAIL|Fatal|error represents|exceeded|crashed|Restarting" || true
          grep -q "TEST SUCCEEDED" test.log || grep -q "** TEST SUCCEEDED **" test.log

      - name: Print test failures
        if: always()
        run: |
          xcrun xcresulttool get test-results tests --path TestResults.xcresult --format json 2>/dev/null | python3 .github/failures.py | head -80 || true

      - name: Print app crash reports
        if: always()
        run: |
          for f in $(find ~/Library/Logs/DiagnosticReports -name "AWIeffect*" 2>/dev/null | head -3); do
            echo "SKIP-CRASH file $f"
            python3 .github/crashdump.py "$f" | sed 's/^/SKIP-CRASH /' | head -120
          done

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test.log
            TestResults.xcresult
          if-no-files-found: ignore

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: /tmp/awi-ui
          if-no-files-found: warn

      - name: Upload contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-sheet
          path: /tmp/awi-contact-sheet.png
          if-no-files-found: warn

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project AWIeffect.xcodeproj -scheme AWIeffect \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AWIeffect.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | tee archive.log | grep -E "error:|ARCHIVE" || true
          test -d build/AWIeffect.xcarchive/Products/Applications/AWIeffect.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/AWIeffect.xcarchive/Products/Applications/AWIeffect.app Payload/
          # The app icon and bundled resources must be inside the app (a missing asset catalog = blank icon).
          test -f Payload/AWIeffect.app/Assets.car || { echo "ERROR: Assets.car missing (no app icon)"; exit 1; }
          test -f Payload/AWIeffect.app/default-preview.jpg || { echo "ERROR: default-preview.jpg missing"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon" Payload/AWIeffect.app/Info.plist || { echo "ERROR: CFBundleIcons missing"; exit 1; }
          ls Payload/AWIeffect.app | grep -i icon || true
          zip -qry AWIeffect.ipa Payload
          ls -lh AWIeffect.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AWIeffect-ipa
          path: AWIeffect.ipa
