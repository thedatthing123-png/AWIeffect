name: Segmentation model probe
on:
  push:
    branches: [feat/rig-authoring-overhaul]
    paths:
      - App/Media/InteractiveSelection.swift
      - App/Media/PromptSegmentationModel.swift
      - App/SegmentationModels/**
      - scripts/segmentation_probe.swift
      - scripts/prepare_segmentation_model.py
      - .github/workflows/segmentation.yml
  workflow_dispatch:
concurrency:
  group: segmentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare portable decoder outputs
        run: |
          python -m pip install coremltools==9.0
          mkdir -p /tmp/awi-converted
          python scripts/prepare_segmentation_model.py \
            App/SegmentationModels/SAM2_1TinyMaskDecoderFLOAT16.mlpackage \
            /tmp/awi-converted/SAM2_1TinyMaskDecoderFLOAT16.mlpackage
      - name: Compile Core ML models
        run: |
          mkdir -p /tmp/awi-models
          for model in App/SegmentationModels/SAM2_1Tiny*.mlpackage; do
            if [[ "$model" == *MaskDecoder* ]]; then model=/tmp/awi-converted/SAM2_1TinyMaskDecoderFLOAT16.mlpackage; fi
            xcrun coremlcompiler compile "$model" /tmp/awi-models
          done
      - name: Build native model probe
        run: |
          xcrun swiftc -O -DDEBUG -parse-as-library -target arm64-apple-macosx15.0 \
            App/Media/PromptSegmentationModel.swift App/Media/InteractiveSelection.swift \
            scripts/segmentation_probe.swift -o /tmp/segmentation-probe
      - name: Evaluate masks
        run: |
          set -o pipefail
          /tmp/segmentation-probe /tmp/awi-models /tmp/awi-native-selection 2>&1 | tee /tmp/awi-model-probe.log
      - name: Upload masks and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-selection-evaluation
          path: |
            /tmp/awi-native-selection
            /tmp/awi-model-probe.log
            /tmp/awi-converted
